<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Ngày Hớt Tóc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .result {
            margin-top: 30px;
            display: none;
        }
        .countdown-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }
        .countdown-title {
            color: #666;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .countdown-time {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }
        .progress-container {
            width: 100%;
            height: 25px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            border-radius: 15px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .date-info {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
        }
        .reset-btn {
            background: #f44336;
            margin-top: 20px;
        }
        .complete {
            color: #28a745;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✂️ Đếm Ngược Ngày Hớt Tóc</h1>
        
        <div id="formSection">
            <div class="form-group">
                <label>Ngày hớt tóc lần trước:</label>
                <input type="date" id="lastDate">
            </div>
            
            <div class="form-group">
                <label>Số ngày hoặc tháng hớt tiếp theo:</label>
                <input type="number" id="intervalValue" placeholder="Nhập số" min="1">
            </div>
            
            <div class="form-group">
                <label>Đơn vị thời gian:</label>
                <select id="intervalUnit" style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;">
                    <option value="days">Ngày</option>
                    <option value="months">Tháng</option>
                </select>
            </div>
            
            <button onclick="startCountdown()">Bắt Đầu Đếm Ngược</button>
        </div>

        <div class="result" id="resultSection">
            <div class="countdown-box">
                <p class="countdown-title">Đến ngày hớt tóc tiếp theo còn:</p>
                <div class="countdown-time" id="countdownTime"></div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
                
                <div class="date-info">
                    <p>Ngày hớt lần trước: <span id="lastDateShow"></span></p>
                    <p>Ngày hớt tiếp theo: <span id="nextDateShow"></span></p>
                </div>
            </div>
            <button class="reset-btn" onclick="resetData()">Đặt Lại / Xóa Dữ Liệu</button>
        </div>
    </div>

    <script>
        // Tải dữ liệu đã lưu khi mở trang
        window.onload = function() {
            const savedData = localStorage.getItem('haircutData');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('lastDate').value = data.lastDate;
                document.getElementById('intervalValue').value = data.intervalValue;
                document.getElementById('intervalUnit').value = data.intervalUnit;
                calculateNextDate(data.lastDate, data.intervalValue, data.intervalUnit);
            }
        };

        function startCountdown() {
            const lastDate = document.getElementById('lastDate').value;
            const intervalValue = parseInt(document.getElementById('intervalValue').value);
            const intervalUnit = document.getElementById('intervalUnit').value;

            if (!lastDate || !intervalValue || intervalValue < 1) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            // Lưu vào localStorage (cache trình duyệt)
            const data = { lastDate, intervalValue, intervalUnit };
            localStorage.setItem('haircutData', JSON.stringify(data));

            calculateNextDate(lastDate, intervalValue, intervalUnit);
        }

        function calculateNextDate(lastDateStr, value, unit) {
            const lastDate = new Date(lastDateStr);
            let nextDate = new Date(lastDate);

            if (unit === 'days') {
                nextDate.setDate(lastDate.getDate() + value);
            } else {
                nextDate.setMonth(lastDate.getMonth() + value);
            }

            // Hiển thị kết quả
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('lastDateShow').textContent = formatDate(lastDate);
            document.getElementById('nextDateShow').textContent = formatDate(nextDate);

            // Bắt đầu đếm ngược
            updateCountdown(nextDate, lastDate);
            setInterval(() => updateCountdown(nextDate, lastDate), 1000);
        }

        function updateCountdown(nextDate, lastDate) {
            const now = new Date();
            const diff = nextDate - now;
            const totalDuration = nextDate - lastDate;

            if (diff <= 0) {
                document.getElementById('countdownTime').innerHTML = '<span class="complete">🎉 Đến ngày hớt tóc rồi!</span>';
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressBar').textContent = '100%';
                return;
            }

            // Tính ngày, giờ, phút, giây
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdownTime').innerHTML = 
                `${days} Ngày ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;

            // Cập nhật thanh tiến độ
            const progressPercent = Math.min(100, Math.max(0, ((totalDuration - diff) / totalDuration) * 100));
            document.getElementById('progressBar').style.width = progressPercent + '%';
            document.getElementById('progressBar').textContent = progressPercent.toFixed(1) + '%';
        }

        function formatDate(date) {
            return date.toLocaleDateString('vi-VN', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric' 
            });
        }

        function resetData() {
            localStorage.removeItem('haircutData');
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('lastDate').value = '';
            document.getElementById('intervalValue').value = '';
        }
    </script>
</body>
</html>
